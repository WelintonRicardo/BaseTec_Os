<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BaseTec OS</title>

  <meta name="description" content="Sistema profissional de ordens de serviço BaseTec OS">

  <meta name="theme-color" content="#0A84FF">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="apple-mobile-web-app-title" content="BaseTec OS">

  <link rel="manifest" href="manifest.json">

  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preload" href="flutter_bootstrap.js" as="script">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 20px;
      background: #f5f7fb;
      z-index: 999999;
    }

    #loader img {
      width: 140px;
      height: 140px;
      object-fit: contain;
      animation: pulse 1.8s infinite ease-in-out;
    }

    .loader-text {
      font-size: 18px;
      font-weight: 600;
      color: #0A84FF;
      letter-spacing: 0.3px;
    }

    .progress-container {
      width: 240px;
      height: 6px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(10, 132, 255, .15);
    }

    .progress-bar {
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: #0A84FF;
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes loading {
      0% {
        margin-left: -40%;
      }

      100% {
        margin-left: 100%;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }
  </style>

</head>

<body>

  <div id="loader">

    <img src="icons/Icon-192.png" alt="BaseTec OS">

    <div class="loader-text">
      Carregando BaseTec OS...
    </div>

    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>

  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loader');

      if (loader) {
        loader.remove();
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>

</html>
