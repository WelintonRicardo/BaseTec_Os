name: basetec_os

description: "Sistema BaseTec OS"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^11.0.0
  geolocator: ^14.0.2
  google_fonts: ^8.1.0
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  native_device_orientation: ^2.1.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^12.0.3
  printing: ^5.14.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  signature: ^6.3.0
  supabase_flutter: ^2.12.4
  url_launcher: ^6.3.0
  uuid: ^4.5.3
  flutter_typeahead: ^6.0.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  patch_package: ^0.0.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo_basetec_full.png
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo_basetec_full.png"

  remove_alpha_ios: true
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/logo_basetec_full.png"
    background_color: "#ffffff"
    theme_color: "#0A84FF"

  windows:
    generate: true
    image_path: "assets/logo_basetec_full.png"

  macos:
    generate: true
    image_path: "assets/logo_basetec_full.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo_basetec_full.png

  android_12:
    image: assets/logo_basetec_full.png
    color: "#ffffff"

  web: false